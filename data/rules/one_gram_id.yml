version: "3.1"

rules:

#-----------------------------------------------------------------------
# qr problem geo panchayat gateway

- rule: one gram id issue
  condition:
    - slot_was_set:
        - project: panchayat
  steps:
    - intent: one_gram_id
    - action: utter_one_gram_id

- rule: one gram id issue when no project select
  condition:
    - slot_was_set:
        - project: null
  steps:
    - intent: one_gram_id
    - action: utter_ask_project

- rule: one gram id issue when project is not panchayat
  condition:
    - slot_was_set:
        - project: ims
  steps:
    - intent: one_gram_id
    - action: utter_project_mismatch
